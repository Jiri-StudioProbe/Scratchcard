<!doctype html>
<!--
  Daily Scratchcard: Technical POC (see PRD). Single file, no dependencies.

  Decisions made:
  - Covered area is controlled by one class, `.scratch-target`, on the card body wrapper.
    To cover only the extract later, move that class (and the canvas) to the extract element.
  - Canvas is sized to the card body with getBoundingClientRect() x devicePixelRatio. A
    ResizeObserver re-sizes it when content/images change the body size. Existing scratch
    progress is carried over and any newly added area is covered with fresh paper, so a resize
    never "un-scratches" or reveals anything. Paper is only fully repainted on a new card.
  - Long extracts: the card grows naturally (no internal scroll, because the canvas uses
    touch-action: none and would trap the finger). Scroll the page by dragging on the margins,
    buttons or footer.
  - Thumbnail space is reserved via aspect-ratio from the API's width/height to avoid layout jump.
  - Api-User-Agent is sent as a courtesy. If the browser blocks it (CORS preflight), the request is
    retried without it and the header is dropped for the rest of the session.
  - Scratch % counts a sampled pixel as scratched when its alpha is below 128. Measure only, no
    behaviour change at any percentage.
  - Read more link is never gated; it is only inert before the first card has loaded (nothing to
    link to yet).
  - Tiny tap = small dot (a tap with no movement still scratches a circle). Strokes use
    getCoalescedEvents() when available for smoother fast swipes.

  Interests + history (v2):
  - Interests are a hand-written 3-level tree (TREE): broad theme > narrower > narrowest. Only the
    narrowest level (leaf) carries 1-2 seed article titles. A selected broad/mid node expands to a
    random leaf under it. (Wikipedia categories were tried first and rejected: deepcategory search
    leaks across the whole category graph and returned unrelated articles for most leaves.)
  - Cards for a leaf: list=search with morelike:<seeds> at a random offset gives similar article
    titles (list/outline/timeline pages skipped), then the REST summary endpoint gives the card
    (so rendering and validity checks are unchanged). morelike ignores srsort=random, hence the
    random offset. Anything that fails falls back to the plain random summary.
  - EXPLORE_RATE of cards are plain random Wikipedia, regardless of interests.
  - History entry per card: shown -> read (Read more tapped) or ignored (New card tapped without
    Read more). Cards left behind by closing the page stay "shown". Max scratch % is stored too.
  - Taste weights are derived from history on the fly (no separate weight store): a read counts
    +2, an ignore costs 0.5 scaled by how much was scratched (min 0.2, so a skip before looking
    barely counts). Credit flows up to parents because ids are path prefixes.
  - Every SUGGEST_EVERY cards, a "More like this?" screen offers narrower/sibling topics under what
    you already picked (ranked by what you read), plus one new broad theme. Tapping adds it.
  - Everything lives in localStorage (per device). Ids are slugs of the labels: renaming a label in
    TREE orphans stored picks, which are silently dropped on load.
-->
<html lang="en">

<title>Daily Scratchcard</title>
<style>
  :root {
    --page-bg: #3f7f8c;
    --card-bg: #ffffff;
    --ink: #1d2a2e;
    --muted: #5d6b70;
    --accent: #f2b134;
    --accent-ink: #2a1d00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page-bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding:
      calc(16px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(12px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
  }
  main { flex: 1 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
    overflow: hidden;
    transition: opacity .15s;
  }
  .card.loading { opacity: .45; pointer-events: none; }

  /* The thing hidden under the paper. One class, easy to move later. */
  .scratch-target { position: relative; }
  .card-content { padding: 16px; }

  .thumb {
    display: block;
    width: 100%;
    height: auto;
    max-height: 260px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 14px;
    background: #e6ebec;
  }
  .title { margin: 0; font-size: 1.5rem; line-height: 1.2; }
  .desc { margin: 4px 0 0; color: var(--muted); font-style: italic; }
  .extract { margin: 12px 0 0; }

  canvas#paper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    cursor: crosshair;
  }

  .state {
    padding: 48px 24px;
    text-align: center;
    color: var(--muted);
  }
  .state strong { display: block; color: var(--ink); font-size: 1.15rem; margin-bottom: 14px; }

  .actions { display: flex; gap: 12px; }
  .btn {
    flex: 1;
    min-height: 52px;
    padding: 0 16px;
    border-radius: 14px;
    border: 2px solid rgba(255, 255, 255, .85);
    background: transparent;
    color: #fff;
    font: inherit;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .state .btn { display: inline-flex; flex: none; padding: 0 24px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .panel { padding: 20px 16px 16px; }
  .panel h2 { margin: 0; font-size: 1.35rem; line-height: 1.25; }
  .panel .step { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .panel .sub { margin: 4px 0 16px; color: var(--muted); }
  .group { margin: 0 0 16px; }
  .group h3 { margin: 0 0 8px; font-size: .8rem; font-weight: 600; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 40px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1.5px solid #cdd7d9;
    background: #fff;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    text-align: left;
  }
  .chip small { display: block; font-size: 11px; color: var(--muted); line-height: 1.2; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .chip[aria-pressed="true"] small { color: var(--accent-ink); opacity: .7; }
  .panel-actions { display: flex; gap: 12px; margin-top: 8px; }
  .panel .btn { color: var(--ink); border-color: #cdd7d9; min-height: 48px; }
  .panel .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .counts { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
  .hist { list-style: none; margin: 0 0 12px; padding: 0; }
  .hist li { padding: 10px 0; border-bottom: 1px solid #e6ebec; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .hist a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .hist .meta { display: block; font-size: 12px; color: var(--muted); }
  .badge { flex: none; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #e6ebec; color: var(--muted); }
  .badge.read { background: #d4efdc; color: #1c5a31; }
  .badge.shown { background: #fbe9bf; color: #6b4a00; }

  .tools { display: flex; justify-content: center; gap: 18px; }
  .link { background: none; border: 0; padding: 6px 4px; font: inherit; font-size: 13px; color: rgba(255, 255, 255, .85); text-decoration: underline; cursor: pointer; }

  footer { text-align: center; font-size: 12px; color: rgba(255, 255, 255, .75); }

<body>
<div class="app">
  <main>
    <section class="card loading" id="card" aria-live="polite">
      <div class="scratch-target" id="target">
        <div class="card-content" id="content"></div>
        <canvas id="paper" aria-hidden="true"></canvas>
      </div>
      <div class="state" id="error" hidden>
        <strong>Couldn't fetch a card</strong>
        <button class="btn" id="retry" type="button">Try again</button>
      </div>
      <div class="panel" id="onboard" hidden></div>
      <div class="panel" id="suggest" hidden></div>
      <div class="panel" id="history" hidden></div>
    </section>

    <div class="actions" id="actions">
      <a class="btn primary" id="readMore" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true">Read more</a>
      <button class="btn" id="newCard" type="button" disabled>New card</button>
    </div>
    <div class="debug" id="debug" aria-hidden="true"></div>
    <div class="tools" id="tools">
      <button class="link" id="openInterests" type="button">Interests</button>
      <button class="link" id="openHistory" type="button">History</button>
    </div>
  </main>

  <footer>Content from <a id="source" href="https://en.wikipedia.org/" target="_blank" rel="noopener noreferrer">Wikipedia</a>, CC BY-SA 4.0</footer>
</div>

<script>
"use strict";

// ---- Config ---------------------------------------------------------------

const MAX_ATTEMPTS = 3;

const BRUSH_WIDTH = 28;          // CSS px
const PAPER_COLOR = "#f2f2ee";
const HINT_TEXT = "SCRATCH HERE";
const PROGRESS_STEP = 8;         // sample every Nth backing-store pixel
const SCRATCHED_ALPHA = 128;     // alpha below this counts as scratched

const SUGGEST_EVERY = 3;         // show "More like this?" after this many cards
const SUGGESTION_COUNT = 6;
const EXPLORE_RATE = 0.15;       // share of cards that ignore interests (plain random)
const CANDIDATES_PER_SEARCH = 20;
const MAX_OFFSET = 300;           // random sroffset range for morelike results (multiples of CANDIDATES_PER_SEARCH)
const SKIP_TITLE = /^(List|Lists|Outline|Timeline|Index|Glossary) of /;

const HISTORY_SHOWN = 100;       // rows in the History screen
const STORE_KEY = "scratchcard.v1";

// ---- Elements -------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const card = $("card"), target = $("target"), content = $("content"), canvas = $("paper");
const errorBox = $("error"), actions = $("actions"), debugEl = $("debug"), toolsEl = $("tools");

const ctx = canvas.getContext("2d");


// ---- Taxonomy -------------------------------------------------------------
// node = [label, children[]] or [label, "Seed article|Seed article"] for a leaf.
// Seeds are real Wikipedia article titles; cards are articles similar to them (CirrusSearch morelike:).

const slug = (t) => t.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const NODES = new Map();
(function build(list, parent) {
  for (const [label, c] of list) {
    const node = {
      id: (parent ? parent.id + "/" : "") + slug(label), label, parent,
      depth: parent ? parent.depth + 1 : 0, children: [], seeds: typeof c === "string" ? c : null,
    };
    NODES.set(node.id, node);
    if (parent) parent.children.push(node);
    if (Array.isArray(c)) build(c, node);
  }
})(TREE, null);
const ROOTS = [...NODES.values()].filter((n) => !n.parent);
const leavesOf = (n) => (n.children.length ? n.children.flatMap(leavesOf) : [n]);
const isUnder = (id, ancestorId) => id === ancestorId || id.startsWith(ancestorId + "/");
const pathLabel = (n) => (n.parent ? pathLabel(n.parent) + " › " + n.label : n.label);

// ---- State (localStorage) -------------------------------------------------
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && typeof s === "object") {
      return {
        interests: (Array.isArray(s.interests) ? s.interests : []).filter((id) => NODES.has(id)),
        history: Array.isArray(s.history) ? s.history : [],
        sinceSuggest: s.sinceSuggest | 0,
      };
    }
  } catch { /* storage unavailable or corrupt: start fresh */ }
  return { interests: [], history: [], sinceSuggest: 0 };
}
const state = loadState();
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { /* ignore */ }
}

// Selecting a node also selects its ancestors; deselecting drops its descendants.
function selectNode(set, node) { for (let n = node; n; n = n.parent) set.add(n.id); }
function deselectNode(set, node) { for (const id of [...set]) if (isUnder(id, node.id)) set.delete(id); }

// The most specific picks: selected nodes with no selected child.
function frontier(ids = state.interests) {
  const sel = new Set(ids);
  return ids.map((id) => NODES.get(id)).filter((n) => !n.children.some((c) => sel.has(c.id)));
}

// ---- Taste (derived from history) ----------------------------------------
function statsFor(id) {
  let read = 0, shown = 0, ignoredCost = 0;
  for (const e of state.history) {
    if (!e.node || !isUnder(e.node, id)) continue;
    shown++;
    if (e.out === "read") read++;
    else if (e.out === "ignored") ignoredCost += Math.max(0.2, (e.pct || 0) / 100);
  }
  return { read, shown, ignoredCost };
}
function weightOf(id) {
  const s = statsFor(id);
  return Math.max(0.2, 1 + 2 * s.read - 0.5 * s.ignoredCost);
}
function weightedPick(items, w) {
  const ws = items.map(w);
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
function chooseLeaf() {
  const f = frontier();
  if (!f.length) return null;
  const node = weightedPick(f, (n) => weightOf(n.id));
  return weightedPick(leavesOf(node), (l) => weightOf(l.id));
}

// ---- Data -----------------------------------------------------------------
let useApiUserAgent = true;
let loadToken = 0;

async function getJSON(url) {
  const init = { cache: "no-store" };
  if (useApiUserAgent) init.headers = { "Api-User-Agent": API_USER_AGENT };
  let res;
  try {
    res = await fetch(url, init);
  } catch (err) {
    if (!useApiUserAgent) throw err;
    // Possibly a CORS preflight rejection of the courtesy header: drop it and retry once.
    useApiUserAgent = false;
    res = await fetch(url, { cache: "no-store" });
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

const isValid = (d) => d && d.type !== "disambiguation" && typeof d.extract === "string" && d.extract.trim() !== "";
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const keyOf = (title) => title.replace(/ /g, "_");
const cardKey = (d) => (d.titles && d.titles.canonical) || keyOf(d.title || "");

async function searchTitles(leaf) {
  const query = async (offset) => {
    const params = new URLSearchParams({
      action: "query", format: "json", origin: "*", list: "search",
      srsearch: "morelike:" + leaf.seeds, srnamespace: "0",
      srlimit: String(CANDIDATES_PER_SEARCH), sroffset: String(offset), srprop: "",
    });
    const j = await getJSON(ACTION_URL + "?" + params);
    return ((j.query && j.query.search) || []).map((r) => r.title).filter((t) => !SKIP_TITLE.test(t));
  };
  // A random page of similar articles for variety; fall back to the closest matches if it is past the end.
  const slots = Math.floor(MAX_OFFSET / CANDIDATES_PER_SEARCH) + 1;
  const offset = CANDIDATES_PER_SEARCH * Math.floor(Math.random() * slots);
  const titles = await query(offset);
  return titles.length || offset === 0 ? titles : query(0);
}

async function fetchInterestCard(leaf) {
  const seen = new Set(state.history.map((e) => e.k));
  const titles = shuffle((await searchTitles(leaf)).filter((t) => !seen.has(keyOf(t)))).slice(0, MAX_ATTEMPTS);
  for (const t of titles) {
    try {
      const d = await getJSON(SUMMARY_URL + encodeURIComponent(keyOf(t)));
      if (isValid(d)) return d;
    } catch (err) {
      console.warn("summary failed for", t, err);
    }
  }
  return null;
}

async function fetchRandom() {
  let lastErr = new Error("No valid article");
  for (let i = 0; i < MAX_ATTEMPTS; i++) {
    try {
      const data = await getJSON(API_URL);
      if (isValid(data)) return data;
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr;
}

// Returns { data, node } where node is the leaf id the card was drawn for (null = random).
async function fetchCard() {
  if (frontier().length && Math.random() >= EXPLORE_RATE) {
    for (let i = 0; i < 2; i++) {
      const leaf = chooseLeaf();
      try {
        const d = await fetchInterestCard(leaf);
        if (d) return { data: d, node: leaf.id };
        console.warn("no unseen cards for", leaf.id);
      } catch (err) {
        console.warn("interest fetch failed for", leaf.id, err);
        break;
      }
    }
  }
  return { data: await fetchRandom(), node: null };
}

// ---- History --------------------------------------------------------------
let current = null; // history entry of the card on screen (kept until replaced)

function startEntry(d, node) {
  const e = {
    k: cardKey(d), title: d.title || "Untitled", node, t: Date.now(), out: "shown", pct: 0,
    url: (d.content_urls && d.content_urls.mobile && d.content_urls.mobile.page) || "",
  };
  state.history.push(e);
  if (state.history.length > HISTORY_MAX) state.history.splice(0, state.history.length - HISTORY_MAX);
  state.sinceSuggest++;
  current = e;
  saveState();
}
function markRead() {
  if (!current) return;
  current.out = "read";
  current.readAt = Date.now();
  saveState();
}
function leaveCard() { // New card (or anything that replaces the card) without Read more
  if (current && current.out === "shown") { current.out = "ignored"; saveState(); }
}

// ---- Rendering ------------------------------------------------------------
function renderCard(d) {
  content.replaceChildren();
  if (d.thumbnail && d.thumbnail.source) {
    const img = document.createElement("img");
    img.className = "thumb";
    img.alt = "";
    img.decoding = "async";
    if (d.thumbnail.width && d.thumbnail.height) img.style.aspectRatio = d.thumbnail.width + " / " + d.thumbnail.height;
    img.src = d.thumbnail.source;
    content.append(img);
  }
  const h = document.createElement("h1");
  h.className = "title";
  h.textContent = d.title || "Untitled";
  content.append(h);
  if (d.description) {
    const p = document.createElement("p");
    p.className = "desc";
    p.textContent = d.description;
    content.append(p);
  }
  const ex = document.createElement("p");
  ex.className = "extract";
  ex.textContent = d.extract;
  content.append(ex);

  const url = (d.content_urls && d.content_urls.mobile && d.content_urls.mobile.page) ||
              (d.content_urls && d.content_urls.desktop && d.content_urls.desktop.page) || "";
  if (url) {
    readMore.href = url;
    readMore.removeAttribute("aria-disabled");
    sourceLink.href = url;
  }
}

function setBusy(busy) {
  card.classList.toggle("loading", busy);
  newCardBtn.disabled = busy;
}

async function loadCard() {
  const token = ++loadToken;
  setBusy(true);
  newCardBtn.textContent = "Shuffling…";
  try {
    const { data, node } = await fetchCard();
    if (token !== loadToken) return;
    setView("card");
    renderCard(data);
    startEntry(data, node);
    paintPaper();
    setProgress(0, false);
  } catch (err) {
    if (token !== loadToken) return;
    console.error("Card fetch failed:", err);
    setView("error");
  } finally {
    if (token === loadToken) {
      newCardBtn.textContent = "New card";
      setBusy(false);
    }
  }
}

// ---- Views ----------------------------------------------------------------
let view = "card", prevView = "card";
function setView(name) {
  if (name !== view) prevView = view;
  view = name;
  target.hidden = name !== "card";
  actions.hidden = name !== "card";
  errorBox.hidden = name !== "error";
  onboardEl.hidden = name !== "onboard";
  suggestEl.hidden = name !== "suggest";
  historyEl.hidden = name !== "history";
  toolsEl.hidden = name === "onboard" || name === "suggest";
  if (name !== "card") debugEl.textContent = "";
  if (name === "onboard" || name === "suggest" || name === "history") card.classList.remove("loading");
}

// Tiny element builder for the panels.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  el.append(...kids.flat().filter((x) => x != null && x !== false));
  return el;
}
function chip(node, pressed, onToggle, withPath) {
  const b = h("button", { class: "chip", type: "button", "aria-pressed": String(pressed) },
    node.label, withPath && node.parent ? h("small", {}, pathLabel(node.parent)) : null);
  b.addEventListener("click", () => {
    const now = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(now));
    onToggle(now);
  });
  return b;
}

// ---- Onboarding: three refining steps ------------------------------------
const STEP_TEXT = [
  null,
  ["What are you into?", "Pick a few broad themes."],
  ["Narrow it down", "Pick what appeals within each theme."],
  ["One level deeper", "Skip anything you don't care about."],
];

function showOnboarding() {
  const editing = state.interests.length > 0;
  const sel = new Set(state.interests);
  const groupsFor = (step) => {
    if (step === 1) return [{ heading: null, nodes: ROOTS }];
    const parents = [...sel].map((id) => NODES.get(id)).filter((n) => n.depth === step - 2 && n.children.length);
    return parents.map((n) => ({ heading: pathLabel(n), nodes: n.children }));
  };
  const finish = () => {
    state.interests = [...sel];
    state.sinceSuggest = 0;
    saveState();
    leaveCard();
    loadCard();
  };

  const render = (step) => {
    const groups = groupsFor(step);
    const next = h("button", { class: "btn primary", type: "button" }, step === 3 ? "Start scratching" : "Continue");
    const syncNext = () => { next.disabled = step === 1 && ![...sel].some((id) => NODES.get(id).depth === 0); };
    next.addEventListener("click", () => {
      if (step === 3 || (step === 2 && !groupsFor(3).length)) finish();
      else render(step + 1);
    });

    const back = step > 1
      ? h("button", { class: "btn", type: "button", onclick: () => render(step - 1) }, "Back")
      : editing ? h("button", { class: "btn", type: "button", onclick: () => setView(prevView) }, "Cancel") : null;

    onboardEl.replaceChildren(
      h("div", { class: "step" }, "Step " + step + " of 3"),
      h("h2", {}, STEP_TEXT[step][0]),
      h("p", { class: "sub" }, STEP_TEXT[step][1]),
      ...groups.map((g) => h("div", { class: "group" },
        g.heading ? h("h3", {}, g.heading) : null,
        h("div", { class: "chips" }, g.nodes.map((n) => chip(n, sel.has(n.id), (on) => {
          if (on) selectNode(sel, n); else deselectNode(sel, n);
          syncNext();
        }))))),
      h("div", { class: "panel-actions" }, back, next),
    );
    syncNext();
  };

  setView("onboard");
  render(1);
}

// ---- Suggestions: "More like this?" --------------------------------------
function suggestionCandidates() {
  const sel = new Set(state.interests);
  const kids = [];
  for (const id of sel) {
    for (const c of NODES.get(id).children) {
      if (!sel.has(c.id)) kids.push({ n: c, score: 1 + 0.5 * statsFor(id).read + Math.random() });
    }
  }
  kids.sort((a, b) => b.score - a.score);
  const roots = ROOTS.filter((r) => !sel.has(r.id));
  const out = kids.slice(0, roots.length ? SUGGESTION_COUNT - 1 : SUGGESTION_COUNT).map((x) => x.n);
  if (roots.length) out.push(roots[Math.floor(Math.random() * roots.length)]);
  return out;
}

function showSuggest() {
  const nodes = suggestionCandidates();
  if (!nodes.length) return false;
  const carryOn = () => { state.sinceSuggest = 0; saveState(); loadCard(); };
  suggestEl.replaceChildren(
    h("h2", {}, "More like this?"),
    h("p", { class: "sub" }, "Tap anything that sounds good and we'll mix it in."),
    h("div", { class: "group" }, h("div", { class: "chips" }, nodes.map((n) => chip(n, false, (on) => {
      if (!on) return;
      const sel = new Set(state.interests);
      selectNode(sel, n);
      state.interests = [...sel];
      saveState();
    }, true)))),
    h("div", { class: "panel-actions" }, h("button", { class: "btn primary", type: "button", onclick: carryOn }, "Keep scratching")),
  );
  setView("suggest");
  return true;
}

// ---- History screen -------------------------------------------------------
function showHistory() {
  const hist = state.history;
  const n = (out) => hist.filter((e) => e.out === out).length;
  const fmt = (t) => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const rows = hist.slice(-HISTORY_SHOWN).reverse().map((e) => h("li", {},
    h("div", {},
      e.url ? h("a", { href: e.url, target: "_blank", rel: "noopener noreferrer" }, e.title) : e.title,
      h("span", { class: "meta" },
        (e.node && NODES.has(e.node) ? pathLabel(NODES.get(e.node)) : "random") + " · " + fmt(e.t) + " · " + (e.pct || 0) + "% scratched")),
    h("span", { class: "badge " + e.out }, e.out)));
  historyEl.replaceChildren(
    h("h2", {}, "History"),
    h("p", { class: "sub" }, hist.length + " cards: " + n("read") + " read, " + n("ignored") + " ignored, " + n("shown") + " left open."),
    hist.length ? h("ul", { class: "hist" }, rows) : h("p", { class: "sub" }, "Nothing yet."),
    h("div", { class: "panel-actions" },
      h("button", { class: "btn", type: "button", onclick: () => setView(prevView) }, "Back"),
      hist.length ? h("button", { class: "btn", type: "button", onclick: () => {
        if (confirm("Clear all history?")) { state.history = []; current = null; saveState(); showHistory(); }
      } }, "Clear") : null),
  );
  setView("history");
}

// ---- Paper ----------------------------------------------------------------
let cssW = 0, cssH = 0, dpr = 1;

function sizeCanvas() {
  const r = target.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  cssW = r.width;
  cssH = r.height;
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawPaper(w, h, x0 = 0, y0 = 0) {
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = PAPER_COLOR;
  ctx.fillRect(x0, y0, w, h);
  // speckle
  const n = Math.round((w * h) / 10);
  for (let i = 0; i < n; i++) {
    const v = Math.random() < 0.5 ? 0 : 255;
    ctx.fillStyle = "rgba(" + v + "," + v + "," + v + "," + (Math.random() * 0.07).toFixed(3) + ")";
    const s = Math.random() < 0.15 ? 2 : 1;
    ctx.fillRect(x0 + Math.random() * w, y0 + Math.random() * h, s, s);
  }
  // a few soft fibres
  ctx.lineWidth = 0.6;
  for (let i = 0; i < Math.round((w * h) / 2500); i++) {
    const x = x0 + Math.random() * w, y = y0 + Math.random() * h, a = Math.random() * Math.PI;
    ctx.strokeStyle = "rgba(120,110,90," + (0.04 + Math.random() * 0.06).toFixed(3) + ")";
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6);
    ctx.stroke();
  }
}

function drawHint() {
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(150,150,145,.6)";
  ctx.font = "600 15px system-ui, -apple-system, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(HINT_TEXT.split("").join(" "), cssW / 2, cssH / 2);
}

// Full repaint: only on load and when a new card loads.
function paintPaper() {
  sizeCanvas();
  drawPaper(cssW, cssH);
  drawHint();
}

// Content size changed (images loaded, rotation, ...): keep progress, cover any new area.
function resizeKeepingProgress() {
  if (target.hidden) return;
  const r = target.getBoundingClientRect();
  if (Math.abs(r.width - cssW) < 0.5 && Math.abs(r.height - cssH) < 0.5 && dpr === (window.devicePixelRatio || 1)) return;

  const oldW = cssW, oldH = cssH;
  const hadPaper = canvas.width > 1 && oldW > 0;

  // mask = black where the old paper had been scratched away
  let mask = null;
  if (hadPaper) {
    mask = document.createElement("canvas");
    mask.width = canvas.width;
    mask.height = canvas.height;
    const m = mask.getContext("2d");
    m.fillStyle = "#000";
    m.fillRect(0, 0, mask.width, mask.height);
    m.globalCompositeOperation = "destination-out";
    m.drawImage(canvas, 0, 0);
  }

  sizeCanvas();
  drawPaper(cssW, cssH);
  drawHint();
  if (mask) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "destination-out";
    // draw the old mask at its original CSS size, anchored top-left
    ctx.drawImage(mask, 0, 0, mask.width, mask.height, 0, 0, oldW * dpr, oldH * dpr);
    ctx.restore();
  }
}

new ResizeObserver(resizeKeepingProgress).observe(target);
content.addEventListener("load", (e) => { if (e.target.tagName === "IMG") resizeKeepingProgress(); }, true);

// ---- Scratching -----------------------------------------------------------
let activeId = null, last = null, bounds = null;

function localPoint(e) {
  return { x: e.clientX - bounds.left, y: e.clientY - bounds.top };
}

function beginErase() {
  ctx.globalCompositeOperation = "destination-out";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = BRUSH_WIDTH;
  ctx.strokeStyle = "#000";
}

canvas.addEventListener("pointerdown", (e) => {
  if (activeId !== null) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  activeId = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  bounds = canvas.getBoundingClientRect();
  last = localPoint(e);
  beginErase();
  ctx.beginPath();
  ctx.moveTo(last.x, last.y);
  ctx.lineTo(last.x, last.y); // zero-length round-capped segment = a dot on tap
  ctx.stroke();
  e.preventDefault();
});

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerId !== activeId) return;
  const events = typeof e.getCoalescedEvents === "function" ? e.getCoalescedEvents() : [];
  if (!events.length) events.push(e);
  beginErase();
  ctx.beginPath();
  ctx.moveTo(last.x, last.y);
  for (const ev of events) {
    last = localPoint(ev);
    ctx.lineTo(last.x, last.y);
  }
  ctx.stroke();
  e.preventDefault();
});

function endStroke(e) {
  if (e.pointerId !== activeId) return;
  activeId = null;
  last = null;
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  if (e.type === "pointerup") measureProgress();
}
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

// ---- Progress (measure only) ---------------------------------------------
function setProgress(pct, log = true) {
  debugEl.textContent = pct + "% scratched";
  if (log) console.log(pct + "% scratched");
}

function measureProgress() {
  const { width, height } = canvas;
  const data = ctx.getImageData(0, 0, width, height).data;
  let total = 0, cleared = 0;
  for (let y = 0; y < height; y += PROGRESS_STEP) {
    for (let x = 0; x < width; x += PROGRESS_STEP) {
      total++;
      if (data[(y * width + x) * 4 + 3] < SCRATCHED_ALPHA) cleared++;
    }
  }
  const pct = total ? Math.round((cleared / total) * 100) : 0;
  setProgress(pct);
  if (current) { current.pct = Math.max(current.pct || 0, pct); saveState(); }
}

// ---- Wiring ---------------------------------------------------------------
newCardBtn.addEventListener("click", () => {
  leaveCard();
  if (state.sinceSuggest >= SUGGEST_EVERY) {
    if (showSuggest()) return;
    state.sinceSuggest = 0; // nothing left to suggest
  }
  loadCard();
});
retryBtn.addEventListener("click", loadCard);
readMore.addEventListener("click", (e) => {
  if (readMore.getAttribute("aria-disabled") === "true") { e.preventDefault(); return; }
  markRead();
});
readMore.addEventListener("auxclick", markRead); // middle-click opens a tab too
$("openInterests").addEventListener("click", showOnboarding);
$("openHistory").addEventListener("click", showHistory);

if (state.interests.length) loadCard(); else showOnboarding();
</script>
</body>
</html>
